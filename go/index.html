<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supply Leader | Opening WhatsApp</title>
<meta name="description" content="Chat with Supply Leader on WhatsApp about wholesale sourcing for your online store.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
var CONFIG = {
  PIXEL_ID: "1470257481886434",
  WA_NUMBER: "447938422717",
  WA_TEXT: "Hi, I need to open Wholesale Account",
  REDIRECT_MS: 900
};
</script>
<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
(function(){
  var c = null;
  try { c = localStorage.getItem('mc_consent'); } catch(e) {}
  if (c !== 'granted') fbq('consent', 'revoke');
  fbq('init', CONFIG.PIXEL_ID);
  fbq('track', 'PageView');
})();
</script>
<style>
  :root{--dark:#1e1e1e;--blue:#2c41ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--dark);color:#fff;letter-spacing:-.01em;display:flex;flex-direction:column}
  header{padding:20px}
  header img{height:22px;display:block}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 64px;text-align:center}
  .box{max-width:420px;width:100%}
  .ring{width:64px;height:64px;margin:0 auto 28px;border-radius:50%;background:#25d366;display:grid;place-items:center;position:relative}
  .ring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(37,211,102,.35);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
  h1{font-size:30px;font-weight:500;letter-spacing:-.05em;line-height:1.1;margin-bottom:10px}
  p{color:rgba(255,255,255,.65);font-size:15.5px;line-height:1.5}
  .btn{margin-top:28px;display:flex;gap:10px;align-items:center;justify-content:center;background:#25d366;color:#0b2e17;text-decoration:none;font-weight:600;font-size:17px;padding:16px 24px;border-radius:14px}
  .small{margin-top:14px;font-size:12.5px;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<header><img src="https://supplyleader.com/assets/images/logo.png" alt="Supply Leader"></header>
<main><div class="box">
  <div class="ring"><svg width="32" height="32" viewBox="0 0 24 24" fill="#0b2e17" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg></div>
  <h1>Opening WhatsApp…</h1>
  <p>Message us on WhatsApp to Open a Wholesale Account. Simply click "Send," and we will get back to you shortly.</p>
  <a class="btn" id="waBtn" href="#">Open WhatsApp</a>
  <p class="small">Not opening? Tap the button above.</p>
</div></main>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var tag = qs.get('utm_content') || qs.get('utm_campaign') || '';
  var text = CONFIG.WA_TEXT + (tag ? ' [' + tag + ']' : '');
  var waUrl = 'https://wa.me/' + CONFIG.WA_NUMBER + '?text=' + encodeURIComponent(text);
  var btn = document.getElementById('waBtn');
  btn.href = waUrl;
  var fired = false;
  function track(){ if (fired) return; fired = true;
    try { fbq('track', 'Contact', { content_name: 'whatsapp_redirect' }, { eventID: 'wa_' + Date.now() }); } catch(e){} }
  btn.addEventListener('click', track);
  track();
  setTimeout(function(){ window.location.href = waUrl; }, CONFIG.REDIRECT_MS);
})();
</script>
</body>
</html>
